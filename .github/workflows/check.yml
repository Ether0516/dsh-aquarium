name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run build:native
      - run: npm run build
      - run: npm test
      - run: node scripts/qa-native.cjs
      - run: npm run pack:local
